plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'io.github.ben-manes.versions' version '0.59.0' apply false
    id 'io.sentry.jvm.gradle' version '6.19.0' apply false
    id 'com.google.cloud.tools.jib' version '3.5.4' apply false
}

ext.versions = [
        lombok            : '1.18.46',
        mapstruct          : '1.6.3',
        openapi            : '3.1.0',
        solrj              : '10.0.0',
        springCloud        : '2025.1.3',
        testcontainersSolr : '2.0.5',
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}
