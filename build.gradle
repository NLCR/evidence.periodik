plugins {
    id 'java'
    id 'org.jetbrains.kotlin.jvm' version '2.3.21' apply false
    id 'org.jetbrains.kotlin.kapt' version '2.3.21' apply false
    id 'org.jetbrains.kotlin.plugin.spring' version '2.3.21' apply false
    id 'org.springframework.boot' version '4.1.1' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'io.github.ben-manes.versions' version '0.64.0' apply false
    id 'io.sentry.jvm.gradle' version '6.20.0' apply false
    id 'com.google.cloud.tools.jib' version '3.5.4' apply false
    id 'com.google.protobuf' version '0.10.0' apply false
    id 'dev.detekt' version '2.0.0-alpha.3' apply false
    id 'com.diffplug.spotless' version '8.10.2' apply false
}

ext.versions = [
        lombok            : '1.18.48',
        mapstruct          : '1.6.3',
        openapi            : '3.1.1',
        solrj              : '10.0.0',
        springCloud        : '2025.1.3',
        testcontainersSolr : '2.0.5',
        testcontainersPostgresql: '2.0.5',
        pmd                : '7.28.0',
        googleJavaFormat   : '1.36.1',
]

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
}
