spring:
  grpc:
    server:
      port: 9090
      servlet:
        enabled: false
      reflection:
        enabled: false
      health:
        enabled: false
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true
  web:
    error:
      path: /error
      whitelabel:
        enabled: true
      include-exception: true
      include-message: always

solr:
  host: ${SOLR_URL:http://localhost:8983/solr}

permonik:
  core-export:
    grpc:
      token: ${CORE_EXPORT_GRPC_TOKEN}
      max-response-bytes: 4194304
  security:
    internal-jwt:
      secret: ${IDENTITY_JWT_SECRET}

server:
  port: 8080
  forward-headers-strategy: FRAMEWORK

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
#logging:
#  level:
#    org:
#      springframework:
#        security: "DEBUG"

sentry:
  dsn: ""
  enabled: false
