ext {
    lombok = '1.18.46'
    openapi = "3.1.0"
    solrj = '10.0.0'
    mapstruct = '1.6.3'
    testSolr = '2.0.5'
    testRedis = '2.2.4'
}

repositories {
    mavenCentral()
}


dependencies {
    // SPRING BOOT
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // SOLR
    implementation "org.apache.solr:solr-solrj:${solrj}"

    // REDIS
    implementation "org.springframework.session:spring-session-data-redis"
    implementation "org.springframework.boot:spring-boot-starter-data-redis"

    // LOMBOK
    compileOnly "org.projectlombok:lombok:${lombok}"
    annotationProcessor "org.projectlombok:lombok:${lombok}"

    // MAPSTRUCT
    implementation "org.mapstruct:mapstruct:${mapstruct}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstruct}"

    // SWAGGER / OpenAPI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${openapi}"

    // DEVELOPMENT
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    // TESTING
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.testcontainers:testcontainers-solr:${testSolr}"
    testImplementation "com.redis:testcontainers-redis:${testRedis}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootJar') {
    archiveFileName = 'permonik-api.jar'
}

def isNonStable = { version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { keyword ->
        version.toUpperCase().contains(keyword)
    }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
