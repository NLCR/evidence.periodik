plugins {
    id 'java'
    id 'pmd'
    id 'com.diffplug.spotless'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'io.github.ben-manes.versions'
    id 'io.sentry.jvm.gradle'
    id 'com.google.cloud.tools.jib'
}

group = 'cz.incad.nkp.inprove'
version = '0.0.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

def sentryAuthToken = providers.environmentVariable("SENTRY_AUTH_TOKEN").orNull
def hostArchitecture = System.getProperty('os.arch').toLowerCase() in ['aarch64', 'arm64'] ? 'arm64' : 'amd64'
def jibArchitecture = providers.gradleProperty('jibArchitecture').getOrElse(hostArchitecture)

sentry {
    includeSourceContext = sentryAuthToken != null && !sentryAuthToken.isBlank()

    org = "inqool"
    projectName = "permonik-api"
    authToken = sentryAuthToken
}

repositories {
    mavenCentral()
}

pmd {
    toolVersion = versions.pmd
    ruleSets = []
    ruleSetFiles = files(rootProject.file('config/pmd/pmd.xml'))
    ignoreFailures = false
}

spotless {
    ratchetFrom('origin/main')

    java {
        target('src/**/*.java')
        googleJavaFormat(versions.googleJavaFormat).aosp()
        removeUnusedImports()
    }
}

tasks.withType(Pmd).configureEach {
    classpath += files(javaLauncher.map { it.metadata.installationPath.file('lib/jrt-fs.jar') })
    reports {
        html.required = true
        xml.required = true
    }
}


dependencies {
    implementation project(':permonik-domain')
    implementation project(':permonik-core-contract')

    // SPRING BOOT
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'

    // SOLR
    implementation "org.apache.solr:solr-solrj:${versions.solrj}"

    // LOMBOK
    compileOnly "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor "org.projectlombok:lombok:${versions.lombok}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // MAPSTRUCT
    implementation "org.mapstruct:mapstruct:${versions.mapstruct}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${versions.mapstruct}"

    // SWAGGER / OpenAPI
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${versions.openapi}"

    // DEVELOPMENT
    developmentOnly "org.springframework.boot:spring-boot-devtools"

    // TESTING
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    // Exercise the real export client without importing its JDBC/Liquibase application runtime.
    testImplementation(project(':permonik-export-api')) { transitive = false }
    testImplementation 'org.jetbrains.kotlin:kotlin-reflect'
    testImplementation 'org.springframework.boot:spring-boot-starter-grpc-client'
    testImplementation 'io.grpc:grpc-inprocess'
    testImplementation "org.testcontainers:testcontainers-solr:${versions.testcontainersSolr}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}


tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'IDENTITY_JWT_SECRET', 'permonik-api-test-jwt-secret-at-least-32-bytes'
    systemProperty 'CORE_EXPORT_GRPC_TOKEN', UUID.randomUUID().toString().replace('-', '') + UUID.randomUUID().toString().replace('-', '')
    systemProperty 'spring.grpc.server.port', '0'
}

tasks.named('bootJar') {
    archiveFileName = 'permonik-api.jar'
}

jib {
    from {
        image = 'gcr.io/distroless/java25-debian13:nonroot'
        platforms {
            platform {
                architecture = jibArchitecture
                os = 'linux'
            }
        }
    }
    to {
        image = providers.gradleProperty('jibImage').getOrElse('periodik-permonik-api:latest')
        tags = providers.gradleProperty('jibTags')
                .map { it.split(',').findAll { tag -> !tag.isBlank() } as Set }
                .getOrElse([] as Set)
    }
    container {
        mainClass = 'cz.incad.nkp.inprove.permonikapi.PermonikApiApplication'
        user = '65532:65532'
        ports = ['8080']
    }
}

def isNonStable = { version ->
    def stableKeyword = ['RELEASE', 'FINAL', 'GA'].any { keyword ->
        version.toUpperCase().contains(keyword)
    }
    def regex = /^[0-9,.v-]+(-r)?$/
    return !stableKeyword && !(version ==~ regex)
}

tasks.named("dependencyUpdates").configure {
    rejectVersionIf {
        isNonStable(it.candidate.version)
    }
}
