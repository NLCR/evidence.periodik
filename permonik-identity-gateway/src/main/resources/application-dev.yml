spring:
  datasource:
    url: ${IDENTITY_DATABASE_URL:jdbc:postgresql://localhost:5433/permonik_identity}

server:
  port: ${SERVER_PORT:8081}
  servlet:
    session:
      cookie:
        secure: false
        same-site: strict

gateway:
  core-url: ${PERMONIK_CORE_URL:http://localhost:8080}
  export-url: ${PERMONIK_EXPORT_URL:http://localhost:8082}

identity:
  dev-user:
    username: admin
    password: ${IDENTITY_DEV_PASSWORD}
    email: admin@example.test
  web:
    admin-url: ${PERMONIK_ADMIN_WEB_URL:http://localhost:3000}
    public-url: ${PERMONIK_PUBLIC_WEB_URL:http://localhost:3000}
    admin-hosts: ${PERMONIK_ADMIN_HOSTS:localhost}
    public-hosts: ${PERMONIK_PUBLIC_HOSTS:localhost}
