x-backend-build: &backend-build
  context: .
  dockerfile: infra/development/backend.Dockerfile

x-frontend-build: &frontend-build
  context: .
  dockerfile: infra/development/frontend.Dockerfile

x-permonik-api-reload: &permonik-api-reload
  command:
    - sh
    - -c
    - >-
      ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx512m
      :permonik-api:classes &&
      touch permonik-api/build/resources/main/.reloadtrigger

x-permonik-export-api-reload: &permonik-export-api-reload
  command:
    - sh
    - -c
    - >-
      ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx512m
      :permonik-export-api:classes &&
      touch permonik-export-api/build/resources/main/.reloadtrigger

x-permonik-identity-gateway-reload: &permonik-identity-gateway-reload
  command:
    - sh
    - -c
    - >-
      ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx512m
      :permonik-identity-gateway:classes &&
      touch permonik-identity-gateway/build/resources/main/.reloadtrigger

services:
  permonik-web:
    build: *frontend-build
    image: periodik-permonik-web-dev:local
    networks:
      - permonik
    ports:
      - "3000:3000"
    environment:
      VITE_API_PROXY_TARGET: http://permonik-identity-gateway:8080
      VITE_APP_MODE: admin
      TZ: "Europe/Prague"
    develop:
      watch:
        - action: sync
          path: ./permonik-web
          target: /workspace/permonik-web
          initial_sync: true
          ignore:
            - node_modules/
            - build/
            - .yarn/
            - package.json
            - yarn.lock
        - action: rebuild
          path: ./permonik-web/package.json
        - action: rebuild
          path: ./permonik-web/yarn.lock
        - action: rebuild
          path: ./permonik-web/.yarnrc.yml

  permonik-api:
    build: *backend-build
    image: periodik-backend-dev:local
    command:
      - ./gradlew
      - --no-daemon
      - --max-workers=2
      - -Dorg.gradle.jvmargs=-Xmx512m
      - :permonik-api:bootRun
    depends_on:
      - permonik-database
    networks:
      - permonik
    ports:
      - "8080:8080"
    environment:
      SOLR_URL: http://permonik-database:8983/solr
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: .reloadtrigger
      SPRING_PROFILES_ACTIVE: dev
      TZ: "Europe/Prague"
    volumes:
      - permonik-api-gradle-cache:/home/developer/.gradle
    develop:
      watch:
        - action: sync+exec
          path: ./permonik-api/src
          target: /workspace/permonik-api/src
          initial_sync: true
          exec: *permonik-api-reload
        - action: sync+restart
          path: ./permonik-api
          target: /workspace/permonik-api
          ignore:
            - src/
            - build/
        - action: sync+restart
          path: ./build.gradle
          target: /workspace/build.gradle
        - action: sync+restart
          path: ./settings.gradle
          target: /workspace/settings.gradle
        - action: sync+restart
          path: ./gradle.properties
          target: /workspace/gradle.properties

  permonik-export-api:
    image: periodik-backend-dev:local
    command:
      - ./gradlew
      - --no-daemon
      - --max-workers=2
      - -Dorg.gradle.jvmargs=-Xmx512m
      - :permonik-export-api:bootRun
    depends_on:
      permonik-export-api-database:
        condition: service_healthy
    networks:
      - permonik
    ports:
      - "8082:8080"
    environment:
      EXPORT_API_DATABASE_URL: jdbc:postgresql://permonik-export-api-database:5432/permonik_export
      EXPORT_API_DATABASE_PASSWORD: ${EXPORT_API_DATABASE_PASSWORD:?EXPORT_API_DATABASE_PASSWORD is required}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: .reloadtrigger
      SPRING_PROFILES_ACTIVE: dev
      TZ: "Europe/Prague"
    volumes:
      - permonik-export-api-gradle-cache:/home/developer/.gradle
    develop:
      watch:
        - action: sync+exec
          path: ./permonik-export-api/src
          target: /workspace/permonik-export-api/src
          initial_sync: true
          exec: *permonik-export-api-reload
        - action: sync+restart
          path: ./permonik-export-api
          target: /workspace/permonik-export-api
          ignore:
            - src/
            - build/
        - action: sync+restart
          path: ./build.gradle
          target: /workspace/build.gradle
        - action: sync+restart
          path: ./settings.gradle
          target: /workspace/settings.gradle
        - action: sync+restart
          path: ./gradle.properties
          target: /workspace/gradle.properties

  permonik-identity-gateway:
    image: periodik-backend-dev:local
    command:
      - ./gradlew
      - --no-daemon
      - --max-workers=2
      - -Dorg.gradle.jvmargs=-Xmx512m
      - :permonik-identity-gateway:bootRun
    depends_on:
      permonik-api:
        condition: service_started
      permonik-export-api:
        condition: service_started
      permonik-web:
        condition: service_started
      permonik-identity-database:
        condition: service_healthy
      permonik-identity-redis:
        condition: service_healthy
    networks:
      - permonik
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SERVER_PORT: "8080"
      IDENTITY_DATABASE_URL: jdbc:postgresql://permonik-identity-database:5432/permonik_identity
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?IDENTITY_DATABASE_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: permonik-identity-redis
      PERMONIK_CORE_URL: http://permonik-api:8080
      PERMONIK_EXPORT_URL: http://permonik-export-api:8080
      PERMONIK_ADMIN_WEB_URL: http://permonik-web:3000
      PERMONIK_PUBLIC_WEB_URL: http://permonik-web:3000
      PERMONIK_ADMIN_HOSTS: localhost
      PERMONIK_PUBLIC_HOSTS: localhost
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      IDENTITY_DEV_PASSWORD: ${IDENTITY_DEV_PASSWORD:?IDENTITY_DEV_PASSWORD is required}
      SPRING_DEVTOOLS_RESTART_TRIGGER_FILE: .reloadtrigger
      TZ: "Europe/Prague"
    volumes:
      - permonik-identity-gateway-gradle-cache:/home/developer/.gradle
    develop:
      watch:
        - action: sync+exec
          path: ./permonik-identity-gateway/src
          target: /workspace/permonik-identity-gateway/src
          initial_sync: true
          exec: *permonik-identity-gateway-reload
        - action: sync+restart
          path: ./permonik-identity-gateway
          target: /workspace/permonik-identity-gateway
          ignore:
            - src/
            - build/
        - action: sync+restart
          path: ./build.gradle
          target: /workspace/build.gradle
        - action: sync+restart
          path: ./settings.gradle
          target: /workspace/settings.gradle
        - action: sync+restart
          path: ./gradle.properties
          target: /workspace/gradle.properties

  permonik-identity-database:
    image: postgres:18.6-alpine
    networks:
      - permonik
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: '512M'
    environment:
      POSTGRES_DB: permonik_identity
      POSTGRES_USER: permonik
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?IDENTITY_DATABASE_PASSWORD is required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U permonik -d permonik_identity" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - identity-database-volume:/var/lib/postgresql

  permonik-database:
    image: solr:10.0.0
    networks:
      - permonik
    ports:
      - "8983:8983"
    deploy:
      resources:
        limits:
          memory: '2048M'
    environment:
      SOLR_JAVA_MEM: "-Xms1g -Xmx1g"
      SOLR_MODULES: analysis-extras
    command:
      - solr-fg
      - --user-managed
    volumes:
      - ./solr-data:/var/solr

  permonik-export-api-database:
    image: postgres:18.6-alpine
    networks:
      - permonik
    ports:
      - "5434:5432"
    deploy:
      resources:
        limits:
          memory: '512M'
    environment:
      POSTGRES_DB: permonik_export
      POSTGRES_USER: permonik
      POSTGRES_PASSWORD: ${EXPORT_API_DATABASE_PASSWORD:?EXPORT_API_DATABASE_PASSWORD is required}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U permonik -d permonik_export" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - export-api-database-volume:/var/lib/postgresql

  permonik-identity-redis:
    image: redis:8.10-alpine
    networks:
      - permonik
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100m
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    volumes:
      - identity-session-volume:/data
    command: [ "redis-server", "--appendonly", "yes" ]

networks:
  permonik:

volumes:
  identity-session-volume:
  identity-database-volume:
  export-api-database-volume:
  permonik-api-gradle-cache:
  permonik-export-api-gradle-cache:
  permonik-identity-gateway-gradle-cache:
