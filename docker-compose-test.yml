# Public deployment template. Replace variable references with concrete values only
# in the server-local copy, or supply them through the shell/an external env file.
services:
  permonik-api:
    image: eu.gcr.io/inqool-1301/permonik/test/permonik-api:latest
    restart: unless-stopped
    depends_on:
      - permonik-database
    networks:
      - permonik
    expose:
      - 8080
    deploy:
      resources:
        reservations:
          memory: '1024M'
        limits:
          memory: '2048M'
    environment:
      SPRING_PROFILES_ACTIVE: test
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      SOLR_USERNAME: ${SOLR_USERNAME:?SOLR_USERNAME is required}
      SOLR_PASSWORD: ${SOLR_PASSWORD:?SOLR_PASSWORD is required}
      CORE_EXPORT_GRPC_TOKEN: ${CORE_EXPORT_GRPC_TOKEN:?CORE_EXPORT_GRPC_TOKEN is required}
      LOGGING_FILE_NAME: /tmp/permonik-api.log
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: test
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      TZ: "Europe/Prague"
      SERVER_PORT: "8080"

  permonik-export-api:
    image: eu.gcr.io/inqool-1301/permonik/test/permonik-export-api:latest
    restart: unless-stopped
    depends_on:
      permonik-api:
        condition: service_started
      permonik-export-api-database:
        condition: service_healthy
    networks:
      - permonik
    expose:
      - 8080
    deploy:
      resources:
        reservations:
          memory: '256M'
        limits:
          memory: '1024M'
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: "8080"
      EXPORT_API_DATABASE_URL: jdbc:postgresql://permonik-export-api-database:5432/permonik_export
      EXPORT_API_DATABASE_PASSWORD: ${EXPORT_API_DATABASE_PASSWORD:?EXPORT_API_DATABASE_PASSWORD is required}
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      CORE_EXPORT_GRPC_TOKEN: ${CORE_EXPORT_GRPC_TOKEN:?CORE_EXPORT_GRPC_TOKEN is required}
      CORE_EXPORT_GRPC_TARGET: static://permonik-api:9090
      TZ: "Europe/Prague"

  permonik-export-api-database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    networks:
      - permonik
    deploy:
      resources:
        reservations:
          memory: '256M'
        limits:
          memory: '512M'
    environment:
      POSTGRES_DB: permonik_export
      POSTGRES_USER: permonik
      POSTGRES_PASSWORD: ${EXPORT_API_DATABASE_PASSWORD:?EXPORT_API_DATABASE_PASSWORD is required}
    volumes:
      - /data/postgresql/export:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U permonik -d permonik_export" ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  permonik-web-admin:
    image: eu.gcr.io/inqool-1301/permonik/test/permonik-web-admin:latest
    restart: unless-stopped
    networks:
      - permonik
    expose:
      - 8080
    deploy:
      resources:
        reservations:
          memory: '12M'
        limits:
          memory: '24M'

  permonik-web-public:
    image: eu.gcr.io/inqool-1301/permonik/test/permonik-web-public:latest
    restart: unless-stopped
    networks:
      - permonik
    expose:
      - 8080
    deploy:
      resources:
        reservations:
          memory: '12M'
        limits:
          memory: '24M'

  permonik-identity-gateway:
    image: eu.gcr.io/inqool-1301/permonik/test/permonik-identity-gateway:latest
    restart: unless-stopped
    depends_on:
      - permonik-api
      - permonik-export-api
      - permonik-identity-database
      - permonik-identity-redis
      - permonik-web-admin
      - permonik-web-public
    networks:
      - permonik
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          memory: '96M'
        limits:
          memory: '512M'
    environment:
      SPRING_PROFILES_ACTIVE: test
      SERVER_PORT: "8080"
      IDENTITY_DATABASE_URL: jdbc:postgresql://permonik-identity-database:5432/permonik_identity
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?IDENTITY_DATABASE_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: permonik-identity-redis
      PERMONIK_CORE_URL: http://permonik-api:8080
      PERMONIK_EXPORT_URL: http://permonik-export-api:8080
      PERMONIK_ADMIN_WEB_URL: http://permonik-web-admin:8080
      PERMONIK_PUBLIC_WEB_URL: http://permonik-web-public:8080
      PERMONIK_ADMIN_HOSTS: app.permonik-test.nkp.cz
      PERMONIK_PUBLIC_HOSTS: permonik-test.nkp.cz
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      SAML_SP_ENTITY_ID: https://app.permonik-test.nkp.cz/shibboleth
      SAML_SP_ACS: https://app.permonik-test.nkp.cz/Shibboleth.sso/SAML2/POST
      TZ: "Europe/Prague"
    volumes:
      - /opt/shibboleth-sp-config:/run/secrets/shibboleth:ro

  permonik-identity-database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    networks:
      - permonik
    deploy:
      resources:
        reservations:
          memory: '256M'
        limits:
          memory: '512M'
    environment:
      POSTGRES_DB: permonik_identity
      POSTGRES_USER: permonik
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?IDENTITY_DATABASE_PASSWORD is required}
    volumes:
      - /data/postgresql/identity:/var/lib/postgresql

  permonik-database:
    image: solr:10.0.0
    restart: unless-stopped
    networks:
      - permonik
    ports:
      - "8983:8983"
    deploy:
      resources:
        reservations:
          memory: '3072M'
        limits:
          memory: '4096M'
    environment:
      SOLR_JAVA_MEM: "-Xms2g -Xmx2g"
      SOLR_MODULES: analysis-extras
      SOLR_USERNAME: ${SOLR_USERNAME:?SOLR_USERNAME is required}
      SOLR_PASSWORD: ${SOLR_PASSWORD:?SOLR_PASSWORD is required}
    command:
      - bash
      - /opt/permonik/start-solr.sh
    volumes:
      - /data/solr:/var/solr
      - ./scripts/start-solr.sh:/opt/permonik/start-solr.sh:ro

  permonik-identity-redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    networks:
      - permonik
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100m
    volumes:
      - identity-session-volume:/data
    command: [ "redis-server", "--appendonly", "yes" ]

networks:
  permonik:

volumes:
  identity-session-volume:
