plugins {
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlin.kapt'
    id 'org.jetbrains.kotlin.plugin.spring'
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'io.sentry.jvm.gradle'
    id 'com.google.cloud.tools.jib'
}

group = 'cz.incad.nkp.inprove'
version = '0.0.1'

def sentryAuthToken = providers.environmentVariable("SENTRY_AUTH_TOKEN").orNull
def hostArchitecture = System.getProperty('os.arch').toLowerCase() in ['aarch64', 'arm64'] ? 'arm64' : 'amd64'
def jibArchitecture = providers.gradleProperty('jibArchitecture').getOrElse(hostArchitecture)

sentry {
    includeSourceContext = sentryAuthToken != null && !sentryAuthToken.isBlank()

    org = "inqool"
    projectName = "permonik-export-api"
    authToken = sentryAuthToken
}

kotlin {
    jvmToolchain(25)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':permonik-domain')
    implementation project(':permonik-core-contract')
    kapt 'org.springframework.boot:spring-boot-configuration-processor'

    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-grpc-client'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-liquibase'

    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${versions.openapi}"

    implementation 'org.jetbrains.kotlin:kotlin-reflect'

    implementation 'tools.jackson.module:jackson-module-kotlin'

    implementation 'org.postgresql:postgresql'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.testcontainers:testcontainers-postgresql:${versions.testcontainersPostgresql}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'IDENTITY_JWT_SECRET', 'permonik-export-api-test-jwt-secret-at-least-32-bytes'
}

tasks.named('bootJar') {
    archiveFileName = 'permonik-export-api.jar'
}

jib {
    from {
        image = 'gcr.io/distroless/java25-debian13:nonroot'
        platforms {
            platform {
                architecture = jibArchitecture
                os = 'linux'
            }
        }
    }
    to {
        image = providers.gradleProperty('jibImage').getOrElse('periodik-permonik-export-api:latest')
        tags = providers.gradleProperty('jibTags')
                .map { it.split(',').findAll { tag -> !tag.isBlank() } as Set }
                .getOrElse([] as Set)
    }
    container {
        mainClass = 'cz.incad.nkp.inprove.permonikexportapi.PermonikExportApiApplicationKt'
        user = '65532:65532'
        ports = ['8080']
    }
}
