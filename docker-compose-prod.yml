services:
  permonik-api:
    image: eu.gcr.io/inqool-1301/permonik/prod/permonik-api:${PERMONIK_TAG}
    restart: unless-stopped
    depends_on:
      - permonik-database
    networks:
      - permonik
    expose:
      - 8080
    deploy:
      resources:
        reservations:
          memory: '1024M'
        limits:
          memory: '2048M'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: production
      SENTRY_RELEASE: ${PERMONIK_TAG:?PERMONIK_TAG is required}
      TZ: "Europe/Prague"
      SERVER_PORT: "8080"

  permonik-web-admin:
    image: eu.gcr.io/inqool-1301/permonik/prod/permonik-web-admin:${PERMONIK_TAG}
    restart: unless-stopped
    build:
      context: .
      dockerfile: permonik-web/docker/admin/Dockerfile
    networks:
      - permonik
    expose:
      - 8080
    deploy:
      resources:
        reservations:
          memory: '12M'
        limits:
          memory: '24M'

  permonik-web-public:
    image: eu.gcr.io/inqool-1301/permonik/prod/permonik-web-public:${PERMONIK_TAG}
    restart: unless-stopped
    build:
      context: .
      dockerfile: permonik-web/docker/public/Dockerfile
    networks:
      - permonik
    expose:
      - 8080
    deploy:
      resources:
        reservations:
          memory: '12M'
        limits:
          memory: '24M'

  permonik-identity-gateway:
    image: eu.gcr.io/inqool-1301/permonik/prod/permonik-identity-gateway:${PERMONIK_TAG}
    restart: unless-stopped
    depends_on:
      - permonik-api
      - permonik-identity-database
      - permonik-identity-redis
      - permonik-web-admin
      - permonik-web-public
    networks:
      - permonik
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          memory: '96M'
        limits:
          memory: '512M'
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      IDENTITY_DATABASE_URL: jdbc:postgresql://permonik-identity-database:5432/permonik_identity
      IDENTITY_DATABASE_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?IDENTITY_DATABASE_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: permonik-identity-redis
      PERMONIK_CORE_URL: http://permonik-api:8080
      PERMONIK_EXPORT_URL: http://permonik-export-api:8080
      PERMONIK_ADMIN_WEB_URL: http://permonik-web-admin:8080
      PERMONIK_PUBLIC_WEB_URL: http://permonik-web-public:8080
      PERMONIK_ADMIN_HOSTS: app.permonik.nkp.cz
      PERMONIK_PUBLIC_HOSTS: permonik.nkp.cz
      IDENTITY_JWT_SECRET: ${IDENTITY_JWT_SECRET:?IDENTITY_JWT_SECRET is required}
      SAML_SP_ENTITY_ID: https://app.permonik.nkp.cz/shibboleth
      SAML_SP_ACS: https://app.permonik.nkp.cz/Shibboleth.sso/SAML2/POST
      TZ: "Europe/Prague"
    volumes:
      - /opt/shibboleth-sp-config:/run/secrets/shibboleth:ro

  permonik-identity-database:
    image: postgres:18.6-alpine
    restart: unless-stopped
    networks:
      - permonik
    deploy:
      resources:
        reservations:
          memory: '256M'
        limits:
          memory: '512M'
    environment:
      POSTGRES_DB: permonik_identity
      POSTGRES_USER: permonik
      POSTGRES_PASSWORD: ${IDENTITY_DATABASE_PASSWORD:?IDENTITY_DATABASE_PASSWORD is required}
    volumes:
      - identity-database-volume:/var/lib/postgresql

  permonik-database:
    image: solr:9.10.0
    restart: unless-stopped
    networks:
      - permonik
    ports:
      - "8983:8983"
    deploy:
      resources:
        reservations:
          memory: '3072M'
        limits:
          memory: '4096M'
    environment:
      SOLR_JAVA_MEM: "-Xms2g -Xmx2g"
      SOLR_MODULES: analysis-extras
    volumes:
      - /data/solr:/var/solr

  permonik-identity-redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks:
      - permonik
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          memory: 100m
    volumes:
      - identity-session-volume:/data
    command: [ "redis-server", "--appendonly", "yes" ]

networks:
  permonik:

volumes:
  identity-session-volume:
  identity-database-volume:
